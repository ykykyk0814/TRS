groups:
  - name: travel-recommendation-alerts
    rules:
      # Service availability alerts
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} has been down for more than 1 minute"

      # Database connection alerts
      - alert: HighDatabaseConnections
        expr: pg_stat_database_numbackends > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High number of database connections"
          description: "Database {{ $labels.instance }} has {{ $value }} active connections"

      # Redis memory usage alerts
      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis instance {{ $labels.instance }} is using {{ $value | humanizePercentage }} of available memory"

      # Disk space alerts
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes * 100) / node_filesystem_size_bytes < 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Disk space is running low"
          description: "Disk on {{ $labels.instance }} is {{ $value | humanizePercentage }} full"

      # CPU usage alerts
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage on {{ $labels.instance }} is {{ $value | humanizePercentage }}"

      # Memory usage alerts
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage on {{ $labels.instance }} is {{ $value | humanizePercentage }}"

      # Container restart alerts
      - alert: ContainerRestarting
        expr: increase(container_start_time_seconds[15m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Container is restarting frequently"
          description: "Container {{ $labels.name }} has restarted {{ $value }} times in the last 15 minutes"

      # Airflow specific alerts
      - alert: AirflowDAGFailed
        expr: airflow_dag_failed > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Airflow DAG has failed"
          description: "DAG {{ $labels.dag_id }} has failed tasks"

      # Qdrant specific alerts
      - alert: QdrantHighMemoryUsage
        expr: qdrant_memory_usage_bytes / qdrant_memory_limit_bytes > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Qdrant memory usage is high"
          description: "Qdrant instance {{ $labels.instance }} is using {{ $value | humanizePercentage }} of available memory"
